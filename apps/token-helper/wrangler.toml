name = "flashcards-token-helper"
main = "src/index.ts"
compatibility_date = "2026-11-01"

# Zero state: no KV, D1, R2, Durable Objects, or analytics bindings (§12.3).
# Set secrets via:
#   pnpm --filter @flash/token-helper exec wrangler secret put GOOGLE_CLIENT_ID
#   pnpm --filter @flash/token-helper exec wrangler secret put GOOGLE_CLIENT_SECRET
#   pnpm --filter @flash/token-helper exec wrangler secret put ALLOWED_ORIGINS
# Optional OneDrive storage connector (/ms/*, docs/setup-microsoft.md):
#   pnpm --filter @flash/token-helper exec wrangler secret put MS_CLIENT_ID
#   pnpm --filter @flash/token-helper exec wrangler secret put MS_CLIENT_SECRET
#   pnpm --filter @flash/token-helper exec wrangler secret put MS_TENANT   (default: consumers)

[observability]
enabled = false

# Per-client cap on the token routes (S2): 20 requests a minute per IP and route. The counters are
# short-lived and per Cloudflare location; they hold no user data. `namespace_id` is any positive
# integer that is unique among this account's rate limiters. Remove the block to turn the cap off
# (the Worker skips the check when the binding is absent).
[[ratelimits]]
name = "TOKEN_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
