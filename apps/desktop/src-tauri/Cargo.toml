[package]
name = "flashcards-desktop"
version = "0.1.0"
description = "Flashcards — local-first study (Tauri desktop shell wrapping apps/web/dist)"
edition = "2021"
publish = false

[lib]
name = "flashcards_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-oauth = "2"
tauri-plugin-persisted-scope = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keychain for the Google refresh token (Credential Manager / Keychain / Secret Service).
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Real file size from iCloud `.<name>.icloud` placeholders (`src/icloud.rs`); already in the tree via tauri.
plist = "1"
# Already in the tree via tauri-plugin-sql (sqlx, bundled): `src/sqlite_hardening.rs` checks the
# linked SQLite was compiled with SQLITE_SECURE_DELETE.
libsqlite3-sys = "0.30"

# iCloud Drive container lookup and on-demand downloads (`src/icloud.rs`).
[dev-dependencies]
# Same version and features tauri-plugin-sql already pulls in; opens a pool in a test.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
