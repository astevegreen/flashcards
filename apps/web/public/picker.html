<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="origin" />
    <title>Select Google Sheets or Docs — Flashcards</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 2rem 1rem;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 1rem;
        padding: 1.5rem;
        text-align: center;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 0.75rem;
        padding: 0.65rem 1.2rem;
        font-weight: 600;
        cursor: pointer;
      }
      .muted {
        color: #94a3b8;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="heading">Select Google Sheets or Docs</h1>
      <p id="status" class="muted">Loading Google Picker for Flashcards…</p>
      <button id="open-btn" type="button" hidden>Open Picker</button>
    </main>
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="/picker.js"></script>
  </body>
</html>
