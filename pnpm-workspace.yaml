packages:
  - 'apps/*'
  - 'packages/*'
  - 'tools/*'
# The same virtual-store folder names on every OS (pnpm defaults to 60 on Windows, 120 elsewhere), so
# the paths `cap sync` writes into apps/mobile (capacitor.settings.gradle, CapApp-SPM/Package.swift)
# are identical on Windows, macOS and the Linux CI runners.
virtualStoreDirMaxLength: 60
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20261120.1'
  - '@cloudflare/workers-utils@0.56.0'
  - miniflare@5.20261119.0-beta
  - wrangler@4.166.0
packageExtensions:
  # Upstream imports tslib from its ESM build but does not declare it.
  '@capgo/capacitor-social-login':
    dependencies:
      tslib: ^2.8.1
