name: Security

# Supply-chain and code scanning (review finding T4). None of these jobs is needed by ci.yml's
# `verify`, the one required check, so they report on every pull request without gating merges
# yet: a newly published advisory for an untouched dependency would otherwise block every merge.
#   - dependency-review: fails a pull request that adds or upgrades a dependency with a known
#     vulnerability of any severity (the action's default; licences are not checked).
#   - audit: `pnpm audit` over the whole lockfile, also weekly so a new advisory surfaces between
#     pull requests.
#   - codeql: CodeQL for the TypeScript/JavaScript sources and the workflows themselves. Rust,
#     Kotlin/Java and Swift need their native builds and are left out.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  # Cancel only superseded pull-request runs; pushes to main, the schedule and manual runs complete.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (SonarCloud githubactions:S7637); the comment
# names the release. GitHub's own actions/* keep their major tag, like ci.yml.

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Reads pnpm-lock.yaml only; no install needed. Fails on an advisory of any severity.
      - name: pnpm audit
        run: pnpm audit

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
