name: Security

# Supply-chain and code scanning (review finding T4). None of these jobs is needed by ci.yml's
# `verify`, the one required check, so they report on every pull request without gating merges
# yet: a newly published advisory for an untouched dependency would otherwise block every merge.
#   - dependency-review: fails a pull request that adds or upgrades a dependency with a known
#     vulnerability of any severity (the action's default; licences are not checked).
#   - audit: `pnpm audit --audit-level=moderate` over the whole lockfile, also weekly so a new
#     advisory surfaces between pull requests.
#   - codeql: CodeQL for the TypeScript/JavaScript sources, the workflows themselves and the Rust
#     desktop shell (apps/desktop/src-tauri, build-mode none). Kotlin/Java and Swift need their
#     native builds and are left out.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  # Pull requests share one group per branch, so a newer push cancels the older run. Every other
  # event gets its own group per commit: GitHub also drops a *pending* run when a newer one joins
  # its group, so a shared main group would leave the middle of three quick pushes unverified.
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA (SonarCloud githubactions:S7637); the comment
# names the release. GitHub's own actions/* keep their major tag, like ci.yml.

jobs:
  # Runs on every event so it can be a required check: outside a pull request there is no diff to
  # review, so its steps are skipped and the job reports success instead of "skipped".
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v7

      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5

      - if: github.event_name != 'pull_request'
        run: echo "No pull request, so no dependency diff to review."

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Reads pnpm-lock.yaml only; no install needed. Fails on a moderate, high or critical
      # advisory; low ones are listed but do not fail, so the job stays a signal worth reading.
      - name: pnpm audit
        run: pnpm audit --audit-level=moderate

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions, rust]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
